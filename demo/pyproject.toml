[project]
name = "email-assistant-context-eng"
version = "0.1.0"
description = "An email assistant tutorial demonstrating context engineering patterns with LangChain."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=0.2.0",
    "deepagents>=0.1.0",
    "jupyterlab",
    "python-dotenv",
    "ipywidgets",
    "langgraph-cli[inmem]",
    
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
